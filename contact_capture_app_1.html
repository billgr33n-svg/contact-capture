<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Contact Capture">
    <title>Contact Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5f3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            color: #1a472a;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            outline: none;
            border-color: #2d5f3f;
            box-shadow: 0 0 0 3px rgba(45, 95, 63, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .photo-section {
            margin-bottom: 20px;
        }

        .photo-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        input[type="file"] {
            display: none;
        }

        .photo-button {
            width: 100%;
            padding: 12px;
            background: #f5f5f5;
            border: 2px dashed #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            transition: all 0.2s;
        }

        .photo-button:active {
            background: #efefef;
            border-color: #2d5f3f;
        }

        .photo-preview {
            margin-top: 12px;
            position: relative;
        }

        .photo-preview img {
            max-width: 100%;
            border-radius: 8px;
            max-height: 200px;
        }

        .photo-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tags-section {
            margin-bottom: 20px;
        }

        .tags-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .tags-hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn {
            background: #2d5f3f;
            color: white;
        }

        .submit-btn:active {
            background: #1a472a;
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            background: #f0f0f0;
            color: #333;
        }

        .clear-btn:active {
            background: #e0e0e0;
            transform: scale(0.98);
        }

        .status-message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }

        .date-display {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Contact Capture</h1>
            <p>Quick details about people you meet</p>
        </div>

        <form id="contactForm">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="text" id="date" readonly>
                <div class="date-display" id="dateDisplay"></div>
            </div>

            <div class="form-group">
                <label for="rawNotes">Details</label>
                <textarea id="rawNotes" placeholder="Names, emails, phone, kid details, context, anything relevant..." required></textarea>
            </div>

            <div class="photo-section">
                <label>Photo (optional)</label>
                <div class="photo-input-wrapper">
                    <input type="file" id="photoInput" accept="image/*" capture="environment">
                    <button type="button" class="photo-button" onclick="document.getElementById('photoInput').click()">
                        📷 Add Photo
                    </button>
                </div>
                <div class="photo-preview" id="photoPreview"></div>
            </div>

            <div class="tags-section">
                <label for="tags">Tags (optional)</label>
                <input type="text" id="tags" class="tags-input" placeholder="e.g., manufacturing, church, kids' school">
                <div class="tags-hint">Comma-separated, helps with filtering</div>
            </div>

            <div class="button-group">
                <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
                <button type="button" class="clear-btn" onclick="clearForm()">Clear</button>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </form>
    </div>

    <script>
        // Set date
        function setDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            document.getElementById('date').value = dateStr;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const displayStr = today.toLocaleDateString('en-US', options);
            document.getElementById('dateDisplay').textContent = displayStr;
        }

        // Photo handling
        let selectedPhoto = null;
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedPhoto = event.target.result;
                    displayPhotoPreview();
                };
                reader.readAsDataURL(file);
            }
        });

        function displayPhotoPreview() {
            const preview = document.getElementById('photoPreview');
            if (selectedPhoto) {
                preview.innerHTML = `
                    <div style="position: relative; display: inline-block; width: 100%;">
                        <img src="${selectedPhoto}" style="max-width: 100%; border-radius: 8px; max-height: 200px;">
                        <button type="button" class="photo-remove" onclick="removePhoto()">✕</button>
                    </div>
                `;
            } else {
                preview.innerHTML = '';
            }
        }

        function removePhoto() {
            selectedPhoto = null;
            document.getElementById('photoInput').value = '';
            displayPhotoPreview();
        }

        // Form submission
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            submitBtn.disabled = true;
            statusMsg.className = 'status-message loading';
            statusMsg.textContent = 'Saving...';

            try {
                const formData = {
                    date: document.getElementById('date').value,
                    rawNotes: document.getElementById('rawNotes').value,
                    tags: document.getElementById('tags').value,
                    photo: selectedPhoto
                };

                // Replace with your Apps Script deployment URL
                const scriptUrl = https://script.google.com/macros/s/AKfycbweVIJexaX6S5QELbxiGd_YeOlfevJtYspSNmwHJet1GsiY5MTxGilI_C8Pxw3DdLDqWA/exec;

                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    
                });

                statusMsg.className = 'status-message success';
                statusMsg.textContent = '✓ Saved! Contact added.';
                
                // Reset form
                setTimeout(() => {
                    clearForm();
                    statusMsg.className = 'status-message';
                    submitBtn.disabled = false;
                }, 2000);

            } catch (error) {
                statusMsg.className = 'status-message error';
                statusMsg.textContent = '✗ Error saving. Check setup.';
                submitBtn.disabled = false;
            }
        });

        function clearForm() {
            document.getElementById('contactForm').reset();
            selectedPhoto = null;
            document.getElementById('photoInput').value = '';
            displayPhotoPreview();
            setDate();
            document.getElementById('statusMessage').className = 'status-message';
        }

        // Initialize
        setDate();
    </script>
</body>
</html>
